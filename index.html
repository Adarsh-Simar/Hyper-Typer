<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="./scripts/typer.js" type="module" defer></script>
    <title>Hyper Typer</title>
</head>

<body>
    <header class="header mb-5">
        <h1 class="title">Hyper Typer</h1>
        <h5 class="p-4"></h5>
        <button class="settings-btn" data-bs-toggle="modal" data-bs-target="#exampleModal">
            <i class="bi bi-gear-fill"></i>
        </button>
    </header>

    <section class="pt-2 typer">
        <div class="wrapper">

            <div class="background-text" id="typingText">
                hello world example
            </div>

            <div class="typing-input" id="typingInput" contenteditable="true" spellcheck="false">
            </div>

        </div>
    </section>

    <div class="infoSection">

        <h4>
            Correct Word Count -
            <span id="correctWordCount">0</span>
        </h4>

        <h4 id="wpmComponent" class="d-none">
            WPM -
            <span id="wpmSpeed">0</span>
        </h4>
        <button id="restartBtn" class="restartBtn">
            Type Again
        </button>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">


                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Typing Test Result</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">

                    <!-- Name -->
                    <div class="mb-3">
                        <label for="playerName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="playerName" placeholder="Enter your name">
                    </div>

                    <!-- WPM Speed (Static) -->
                    <div class="mb-3">
                        <label class="form-label">WPM Speed</label>
                        <p class="form-control-plaintext fw-bold" id="wpmSpeed">72 WPM</p>
                    </div>

                    <!-- Number of Words -->
                    <div class="mb-3">
                        <label for="wordCount" class="form-label">Number of Words</label>
                        <input type="number" class="form-control" id="wordCount" placeholder="Enter number of words">
                    </div>

                    <!-- Stats Link -->
                    <div class="mt-3">
                        <a href="/stats.html" class="link-primary">View Detailed Stats →</a>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save Result</button>
                </div>

            </div>


        </div>
    </div>

</body>

</html>
